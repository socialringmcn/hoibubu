<!doctype html>
<!-- 내부용 대시보드 · 비밀번호 잠금 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>크리에이터 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #f0f2f7;
  --text: #16181d;
  --muted: #6b7280;
  --line: #e5e7ee;
  --accent: #5b5bf0;
  --accent-soft: #ecebff;
  --draft: #f59e0b;  --draft-soft: #fef3c7;
  --final: #0ea5e9;  --final-soft: #e0f2fe;
  --upload: #10b981; --upload-soft: #d1fae5;
  --shoot: #ec4899;  --shoot-soft: #fce7f3;
  --other: #8b5cf6;  --other-soft: #ede9fe;
  --danger: #ef4444;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1015; --surface: #171a21; --surface-2: #1f232c; --text: #eceef3; --muted: #9aa1ad;
    --line: #2a2f3a; --accent: #8b8bff; --accent-soft: #25264a;
    --draft-soft: #3a2c0c; --final-soft: #0b2b3b; --upload-soft: #0b3327; --shoot-soft: #3b1029; --other-soft: #2a1e48;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

/* 상단 */
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1200px; margin: 0 auto; padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), #c084fc); font-size: 16px; flex: none; }
.brand-sub { font-size: 12px; color: var(--muted); }
.brand h1 { margin: 0; font-size: 20px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn, select, .btn { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; height: 36px; padding: 0 12px; cursor: pointer; }
.icon-btn { width: 36px; padding: 0; font-size: 18px; }
.icon-btn:hover, .btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; text-decoration: none; color: var(--muted); padding: 10px 14px; font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab .main-badge { font-size: 10px; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

main { padding-top: 16px; padding-bottom: 24px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 28px 0 12px; }
.section-title h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.section-title .hint { color: var(--muted); font-size: 13px; }

/* 공지 */
.notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--muted); white-space: pre-line; box-shadow: var(--shadow); }
.notice details summary { cursor: pointer; color: var(--text); font-weight: 600; }

/* KPI 카드 */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.kpi .label { color: var(--muted); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 6px; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .value small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.kpi .sub { color: var(--muted); font-size: 13px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi.hero { background: linear-gradient(135deg, var(--accent), #a855f7); color: #fff; border: none; }
.kpi.hero .label, .kpi.hero .sub, .kpi.hero .value small { color: rgba(255,255,255,.85); }

/* 패널 */
.grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
.grid-2.even { grid-template-columns: 1fr 1fr; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel h3 { margin: 0 0 12px; font-size: 15px; }
.chart-box { position: relative; height: 280px; }

/* 달력 */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-head h3 { margin: 0; font-size: 18px; }
.cal-nav { display: flex; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cal .dow { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; padding: 8px 0; background: var(--surface-2); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal .dow.sun, .cal .day.sun .num { color: var(--danger); }
.cal .day { min-height: 104px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.cal .day.out { background: var(--surface-2); }
.cal .day.out .num { opacity: .45; }
.cal .num { font-size: 12px; font-weight: 700; }
.cal .day.today .num { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; }
.chip { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; padding: 3px 6px; border-radius: 6px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.dots { display: none; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
.dots i { width: 7px; height: 7px; border-radius: 99px; }
.t-draft { background: var(--draft-soft); color: color-mix(in srgb, var(--draft) 75%, var(--text)); } .bg-draft { background: var(--draft); }
.t-final { background: var(--final-soft); color: color-mix(in srgb, var(--final) 75%, var(--text)); } .bg-final { background: var(--final); }
.t-upload { background: var(--upload-soft); color: color-mix(in srgb, var(--upload) 70%, var(--text)); } .bg-upload { background: var(--upload); }
.t-shoot { background: var(--shoot-soft); color: color-mix(in srgb, var(--shoot) 75%, var(--text)); } .bg-shoot { background: var(--shoot); }
.t-other { background: var(--other-soft); color: color-mix(in srgb, var(--other) 75%, var(--text)); } .bg-other { background: var(--other); }

/* 일정 목록 */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline li.past { opacity: .5; }
.timeline .d { width: 52px; flex: none; text-align: center; }
.timeline .d b { display: block; font-size: 18px; line-height: 1.1; }
.timeline .d span { font-size: 11px; color: var(--muted); }
.timeline .t { flex: 1; min-width: 0; font-weight: 600; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.dday { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 14px; }

/* 브랜드 진행 */
.brands { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.brand-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.brand-card h4 { margin: 0 0 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.steps { display: flex; gap: 6px; }
.step { flex: 1; text-align: center; font-size: 12px; padding: 8px 4px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.step b { display: block; font-size: 13px; color: var(--text); }
.step.on { font-weight: 700; }

/* 문의 표 */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.toolbar input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; height: 36px; padding: 0 12px; flex: 1 1 200px; min-width: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); color: var(--muted); font-weight: 700; position: sticky; top: 0; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.wrap { white-space: pre-line; min-width: 180px; }
td.nowrap, td.brand { white-space: nowrap; }
tr.detail td { background: var(--surface-2); cursor: default; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; }
.detail-grid div span { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.detail-grid div { white-space: pre-line; overflow-wrap: anywhere; }
.more { text-align: center; margin-top: 12px; }
.ty-광고PPL { background: var(--accent-soft); color: var(--accent); }
.ty-선제안 { background: var(--final-soft); color: color-mix(in srgb, var(--final) 75%, var(--text)); }
.ty-공구마켓, .ty-공동구매 { background: var(--upload-soft); color: color-mix(in srgb, var(--upload) 70%, var(--text)); }
.ty-단순선물 { background: var(--shoot-soft); color: color-mix(in srgb, var(--shoot) 75%, var(--text)); }
.ty-기타 { background: var(--surface-2); color: var(--muted); }

/* 오류 · 업로드 */
.alert { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); max-width: 680px; margin: 24px auto; }
.alert h2 { margin: 0 0 8px; font-size: 18px; }
.alert p { color: var(--muted); margin: 6px 0; }
.alert code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 12.5px; word-break: break-all; }
.drop { margin-top: 16px; border: 2px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop label { color: var(--accent); font-weight: 700; cursor: pointer; }
.banner { background: var(--draft-soft); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
.loading { text-align: center; padding: 80px 0; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 32px; }

/* 반응형 */
@media (max-width: 960px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-2.even { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  body { font-size: 14px; }
  .brand h1 { font-size: 17px; }
  .updated { display: none; }
  .tab { padding: 10px 9px; font-size: 14px; }
  .tab .main-badge { margin-left: 3px; }
  .kpi { padding: 14px; }
  .kpi .value { font-size: 24px; }
  .kpi .sub { white-space: normal; }
  .cal .day { min-height: 56px; padding: 4px; }
  .cal .chip { display: none; }
  .cal .dots { display: flex; }
  .chart-box { height: 240px; }
  /* 표 → 카드 */
  .table-wrap { border: 0; overflow: visible; }
  table, thead, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }
  tbody tr { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding: 8px 4px; box-shadow: var(--shadow); }
  td { border: 0; padding: 4px 12px; }
  td[data-label]::before { content: attr(data-label); display: inline-block; width: 74px; color: var(--muted); font-size: 12px; font-weight: 700; }
  td.wrap { min-width: 0; }
  tr.detail { margin-top: -6px; }
}

/* 채널 성과: 월별 표는 모바일에서도 가로 스크롤 표로 유지 */
.table-wrap.scroll th.stick, .table-wrap.scroll td.stick { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.table-wrap.scroll thead th.stick { background: var(--surface-2); z-index: 2; }
.table-wrap.scroll tbody tr { cursor: default; }
@media (max-width: 640px) {
  .table-wrap.scroll { overflow-x: auto; border: 1px solid var(--line); }
  .table-wrap.scroll table { display: table; }
  .table-wrap.scroll thead { display: table-header-group; }
  .table-wrap.scroll tbody { display: table-row-group; }
  .table-wrap.scroll tr { display: table-row; background: none; border: 0; padding: 0; margin: 0; box-shadow: none; border-radius: 0; }
  .table-wrap.scroll th, .table-wrap.scroll td { display: table-cell; width: auto; padding: 8px 10px; border-bottom: 1px solid var(--line); }
}

/* 🔒 비밀번호 잠금 화면 */
body.locked .topbar, body.locked main, body.locked .foot { display: none; }
.lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
              radial-gradient(900px 500px at 110% 110%, color-mix(in srgb, #c084fc 22%, transparent), transparent 60%), var(--bg); }
body:not(.locked) .lock { display: none; }
.lock-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 32px 26px 24px; box-shadow: var(--shadow); text-align: center; }
.lock-icon { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; font-size: 24px; background: linear-gradient(135deg, var(--accent), #c084fc); }
.lock-card h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
.lock-card p { margin: 6px 0 20px; color: var(--muted); font-size: 14px; }
.lock-field { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding-right: 4px; }
.lock-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lock-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; height: 46px; padding: 0 14px; }
.lock-toggle { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 8px 10px; }
.lock-btn { width: 100%; height: 46px; margin-top: 12px; font-weight: 700; font-size: 15px; border-radius: 12px; }
.lock-btn:disabled { opacity: .6; cursor: default; }
.lock-msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.lock-msg.err { color: var(--danger); font-weight: 600; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>
</head>
<body class="locked">
  <!-- 🔒 비밀번호 잠금 화면 -->
  <div id="lock" class="lock">
    <form id="lockForm" class="lock-card" autocomplete="off">
      <div class="lock-icon">🔒</div>
      <h1>내부용 대시보드</h1>
      <p>열람하려면 비밀번호를 입력해 주세요.</p>
      <div class="lock-field">
        <input id="lockPw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password" required>
        <button type="button" id="lockToggle" class="lock-toggle">보기</button>
      </div>
      <button id="lockBtn" class="btn primary lock-btn" type="submit">입장하기</button>
      <div id="lockMsg" class="lock-msg" role="alert"></div>
    </form>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <div>
          <div class="brand-sub" id="siteTitle">크리에이터 대시보드</div>
          <h1 id="creatorName">-</h1>
        </div>
      </div>
      <div class="top-actions">
        <select id="creatorSelect" aria-label="크리에이터 선택" hidden></select>
        <span class="updated" id="updatedAt">불러오는 중…</span>
        <button class="icon-btn" id="refreshBtn" title="지금 새로고침" aria-label="새로고침">⟳</button>
        <button class="icon-btn" id="logoutBtn" title="잠그기 (로그아웃)" aria-label="잠그기" hidden>🔒</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
  </header>

  <main id="view" class="container"></main>

  <footer class="foot container">
    구글 시트 '웹에 게시' CSV를 직접 읽어 표시합니다 · 시트를 수정하면 몇 분 안에 반영돼요
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <script>
/* CSV 해석 모듈 — 화면 코드와 분리해 두어 검증하기 쉽게 만들었습니다. */
(function (root) {
  'use strict';

  /* ---------- 1. 인코딩 ---------- */
  // 구글 시트 CSV는 UTF-8. 엑셀에서 저장한 CSV는 CP949(EUC-KR)일 수 있어 자동 판별.
  function decodeBuffer(buf) {
    const bytes = new Uint8Array(buf);
    try {
      return stripBom(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
    } catch (e) {
      try { return stripBom(new TextDecoder('euc-kr').decode(bytes)); }
      catch (e2) { return stripBom(new TextDecoder('utf-8').decode(bytes)); }
    }
  }
  function stripBom(t) { return t.charCodeAt(0) === 0xfeff ? t.slice(1) : t; }

  /* ---------- 2. CSV → 2차원 배열 (따옴표 안 줄바꿈·쉼표 처리) ---------- */
  function parseCSV(text) {
    const rows = []; let row = []; let cell = ''; let q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
        } else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  const clean = (s) => (s == null ? '' : String(s)).replace(/ /g, ' ').trim();
  const isBlankRow = (r) => r.every((c) => clean(c) === '');
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  /* ---------- 3. 광고 스케줄 (달력형 시트) ---------- */
  // 구조: "10월 스케줄" 제목 → 요일 줄 → [날짜 줄 + 일정 줄 N개] 반복. 한 줄에 달력 2개가 나란히.
  const MONTH_HDR = /^(\d{1,2})\s*월\s*스케줄/;
  const MD = /^(\d{1,2})\s*\/\s*(\d{1,2})$/;
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  function classifyEvent(text) {
    if (/가편|1차|초안|시안/.test(text)) return 'draft';
    if (/최종|수정/.test(text)) return 'final';
    if (/릴스|피드|업로드|숏폼|롱폼|쇼츠|숏츠|게시|YT|IG|TK|틱톡/i.test(text)) return 'upload';
    if (/촬영/.test(text)) return 'shoot';
    return 'other';
  }
  function brandOf(text) {
    return clean(text).split(/\s+/)[0] || clean(text);
  }

  function parseSchedule(rows, startYear) {
    const notices = [];
    const blocks = []; // 달력 블록 {month, year, col}
    const events = new Map();
    let active = [];
    let year = startYear || new Date().getFullYear();
    let prevMonth = null;

    const firstHdr = rows.findIndex((r) => r.some((c) => MONTH_HDR.test(clean(c))));
    (firstHdr < 0 ? rows : rows.slice(0, firstHdr)).forEach((r) =>
      r.forEach((c) => { const t = clean(c); if (t) notices.push(t); }));

    rows.forEach((r, ri) => {
      const hdrs = [];
      r.forEach((c, ci) => { const m = clean(c).match(MONTH_HDR); if (m) hdrs.push({ col: ci, month: +m[1] }); });
      if (hdrs.length) {
        active = hdrs.map((h) => {
          if (prevMonth !== null && h.month < prevMonth) year++; // 12월 → 1월: 연도 넘어감
          prevMonth = h.month;
          const b = { month: h.month, year, col: h.col, dates: [] };
          blocks.push(b);
          return b;
        });
        return;
      }
      active.forEach((b) => {
        const cells = [];
        for (let k = 0; k < 7; k++) cells.push(clean(r[b.col + k]));
        if (cells.some((c) => WEEK.includes(c)) && cells.every((c) => c === '' || WEEK.includes(c))) return; // 요일 줄
        if (cells.some((c) => MD.test(c))) { // 날짜 줄
          b.dates = cells.map((c) => {
            const m = c.match(MD); if (!m) return null;
            const mm = +m[1]; let y = b.year;
            if (b.month === 1 && mm === 12) y--;
            if (b.month === 12 && mm === 1) y++;
            return new Date(y, mm - 1, +m[2]);
          });
          return;
        }
        cells.forEach((c, k) => { // 일정 줄
          if (!c || !b.dates[k]) return;
          c.split(/\n+/).map(clean).filter(Boolean).forEach((t) => {
            const key = iso(b.dates[k]) + '|' + t; // 두 달력에 겹쳐 나오는 주는 한 번만
            if (!events.has(key)) {
              events.set(key, { date: b.dates[k], dateKey: iso(b.dates[k]), text: t, type: classifyEvent(t), brand: brandOf(t), row: ri + 1 });
            }
          });
        });
      });
    });

    const list = [...events.values()].sort((a, b) => a.date - b.date || a.row - b.row);
    return { notices, blocks: blocks.map(({ month, year }) => ({ month, year })), events: list };
  }

  /* ---------- 4. 광고·공구 문의 현황 ---------- */
  function findHeaderRow(rows, mustHave) {
    return rows.findIndex((r) => mustHave.every((k) => r.some((c) => clean(c).replace(/\s/g, '') === k)));
  }
  // "26.1.7" "26.01.14" "26..4.1" "2026-6-22" 등 혼합 형식 처리
  function parseLooseDate(s) {
    const t = clean(s).replace(/\.{2,}/g, '.');
    const m = t.match(/^(\d{4}|\d{2})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})/);
    if (!m) return null;
    let y = +m[1]; if (y < 100) y += 2000;
    const d = new Date(y, +m[2] - 1, +m[3]);
    return isNaN(d) ? null : d;
  }

  function parseInquiries(rows) {
    const h = findHeaderRow(rows, ['유형', '브랜드']);
    if (h < 0) throw new Error('헤더 행(유형·브랜드)을 찾지 못했습니다. 시트의 제목 줄을 확인해 주세요.');
    const header = rows[h].map(clean);
    const col = (name) => header.findIndex((c) => c.replace(/\s/g, '') === name.replace(/\s/g, ''));
    const C = {
      done: col('프로젝트 완료'), type: col('유형'), date: col('문의일'), brand: col('브랜드'),
      agency: col('대행사'), category: col('카테고리'), product: col('제품명'), route: col('문의 경로'),
      channel: col('업로드 채널'), platform: col('요청플랫폼'), wish: col('희망 일정(업로드)'),
      status: col('소통 현황'), confirm: (() => { const i = col('진행확정 여부'); return i >= 0 ? i : header.findIndex((c) => /확정/.test(c)); })(), settle: col('정산 일정'),
      price: col('진행 단가(VAT제외)'), contact: col('담당자명(연락처 or 이메일)'), note: col('비고')
    };
    const get = (r, k) => (C[k] >= 0 ? clean(r[C[k]]) : '');
    const items = []; let skipped = 0;
    rows.slice(h + 1).forEach((r, i) => {
      // 체크박스(TRUE/FALSE)만 있고 내용이 빈 행은 제외
      const content = ['type', 'date', 'brand', 'agency', 'product'].some((k) => get(r, k) !== '');
      if (!content) { if (!isBlankRow(r)) skipped++; return; }
      const rawDate = get(r, 'date');
      const d = parseLooseDate(rawDate);
      items.push({
        row: h + 2 + i,
        done: get(r, 'done').toUpperCase() === 'TRUE',
        type: get(r, 'type') || '미분류',
        rawDate, date: d, month: d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : null,
        brand: get(r, 'brand'), agency: get(r, 'agency').replace(/^[-`\s]+$/, ''),
        category: (get(r, 'category').replace(/^-$/, '') || '미분류'),
        product: get(r, 'product').replace(/^-$/, ''), route: get(r, 'route'), channel: get(r, 'channel'),
        platform: get(r, 'platform'), wish: get(r, 'wish'), status: get(r, 'status'), confirm: get(r, 'confirm'),
        settle: get(r, 'settle'), price: get(r, 'price'), contact: get(r, 'contact'), note: get(r, 'note')
      });
    });
    return { header, items, skipped };
  }

  /* ---------- 5. 기타 CSV: 표 자동 생성 ---------- */
  function parseGenericTable(rows) {
    const filled = rows.map((r) => r.filter((c) => clean(c)).length);
    const max = Math.max(0, ...filled);
    const h = filled.findIndex((n) => n >= Math.max(2, Math.ceil(max * 0.6)));
    if (h < 0) return { header: [], rows: [] };
    const used = rows[h].map((c, i) => i).filter((i) => rows.some((r, ri) => ri >= h && clean(r[i])));
    const header = used.map((i) => clean(rows[h][i]) || `열 ${i + 1}`);
    const body = rows.slice(h + 1).filter((r) => !isBlankRow(r)).map((r) => used.map((i) => clean(r[i])));
    return { header, rows: body };
  }

  /* ---------- 6. 채널 성과 (크리에이터 | 구분 | 누적 | 1월 … 12월) ---------- */
  // 크리에이터 이름은 첫 줄에만 있고(병합 셀) 아래 줄은 비어 있으므로 위 이름을 이어받는다.
  function toNum(s) {
    const t = clean(s).replace(/[,₩\s]/g, '');
    if (t === '' || /^[-–—]+$/.test(t)) return null;
    return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : null;
  }
  function parsePerformance(rows, creatorName) {
    const h = rows.findIndex((r) => r.some((c) => clean(c) === '누적') && r.some((c) => /^1\s*월$/.test(clean(c))));
    if (h < 0) throw new Error('"누적", "1월" 이 있는 헤더 행을 찾지 못했습니다.');
    const hdr = rows[h].map(clean);
    const cCreator = hdr.findIndex((c) => c === '크리에이터');
    const cMetric = hdr.findIndex((c) => c === '구분');
    const cAcc = hdr.indexOf('누적');
    const monthCol = [];
    hdr.forEach((c, i) => { const m = c.match(/^(\d{1,2})\s*월$/); if (m) monthCol[+m[1] - 1] = i; });
    let cur = '';
    const all = [];
    rows.slice(h + 1).forEach((r, i) => {
      if (isBlankRow(r)) return;
      if (cCreator >= 0 && clean(r[cCreator])) cur = clean(r[cCreator]);
      const name = clean(r[cMetric >= 0 ? cMetric : cAcc - 1]);
      if (!name) return;
      all.push({
        creator: cur, name, row: h + 2 + i,
        accRaw: clean(r[cAcc]), acc: toNum(r[cAcc]),
        months: Array.from({ length: 12 }, (_, k) => {
          const raw = monthCol[k] >= 0 ? clean(r[monthCol[k]]) : '';
          const pct = raw.match(/(-?\d+(?:\.\d+)?)\s*%/);
          return { raw, num: toNum(raw), pct: pct ? Number(pct[1]) : null };
        })
      });
    });
    const creators = [...new Set(all.map((m) => m.creator))];
    const norm = (s) => (s || '').replace(/\s/g, '');
    const target = creators.find((c) => norm(c) === norm(creatorName)) || creators[0] || '';
    return { creator: target, matched: creators.some((c) => norm(c) === norm(creatorName)), creators, metrics: all.filter((m) => m.creator === target) };
  }

  const api = { decodeBuffer, parseCSV, parseSchedule, parseInquiries, parseGenericTable, parsePerformance, parseLooseDate, classifyEvent, iso };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SheetParser = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>
/* 화면 구성 코드 — 보통은 고칠 필요가 없습니다. 설정은 config.js에서 하세요. */
(function () {
  'use strict';
  const CFG = window.DASHBOARD_CONFIG;
  const P = window.SheetParser;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const TYPE_LABEL = { draft: '가편·1차본', final: '최종본', upload: '업로드', shoot: '촬영', other: '기타' };
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today = () => startOfDay(new Date());
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const mdw = (d) => `${md(d)} (${WEEK[d.getDay()]})`;
  const dday = (d) => { const n = Math.round((startOfDay(d) - today()) / 864e5); return n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`; };
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const state = { creator: null, cat: null, cache: {}, calMonth: null, charts: [], timer: null, tableLimit: 50 };

  /* ---------------- 비밀번호 잠금 ---------------- */
  // 비밀번호는 코드에 들어 있지 않습니다. 시트 링크·예비 데이터는 비밀번호로만 풀리는 암호문(LOCKED_DATA)으로 들어 있어요.
  const SESSION_KEY = 'dash-unlocked-v1';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function decryptPayload(pw) {
    const L = window.LOCKED_DATA;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(L.salt), iterations: L.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(L.iv) }, key, b64(L.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function applyPayload(pl) {
    CFG.creators.forEach((cr) => cr.categories.forEach((cat) => {
      const key = `${cr.id}/${cat.id}`;
      if (pl.sources && pl.sources[key]) cat.url = pl.sources[key];
      if (pl.fallback && pl.fallback[key]) cat.fallback = pl.fallback[key];
    }));
  }
  function boot() {
    if (!window.LOCKED_DATA) { unlock(null); return; } // 잠금 없이 만든 경우
    let saved = null;
    try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) { /* 저장소 사용 불가 */ }
    if (saved) { try { unlock(JSON.parse(saved)); return; } catch (e) { /* 다시 입력 */ } }
    showLock();
  }
  function showLock() {
    document.body.classList.add('locked');
    const form = $('#lockForm'), input = $('#lockPw'), msg = $('#lockMsg'), btn = $('#lockBtn');
    if (!window.crypto || !crypto.subtle) {
      msg.textContent = '이 브라우저(또는 주소)에서는 잠금 해제를 지원하지 않아요. https 주소로 접속해 주세요.';
      btn.disabled = true; return;
    }
    $('#lockToggle').onclick = () => { input.type = input.type === 'password' ? 'text' : 'password'; $('#lockToggle').textContent = input.type === 'password' ? '보기' : '숨기기'; input.focus(); };
    form.onsubmit = async (ev) => {
      ev.preventDefault();
      if (!input.value) return;
      btn.disabled = true; msg.textContent = '확인 중…'; msg.className = 'lock-msg';
      try {
        const pl = await decryptPayload(input.value);
        try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(pl)); } catch (e) { /* 저장 실패해도 진행 */ }
        input.value = '';
        unlock(pl);
      } catch (e) {
        await new Promise((r) => setTimeout(r, 600));
        msg.textContent = '비밀번호가 올바르지 않아요.'; msg.className = 'lock-msg err';
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        input.select(); btn.disabled = false;
      }
    };
    setTimeout(() => input.focus(), 50);
  }
  function unlock(pl) {
    if (pl) applyPayload(pl);
    document.body.classList.remove('locked');
    $('#lock').remove();
    $('#logoutBtn').hidden = !window.LOCKED_DATA;
    $('#logoutBtn').onclick = () => { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} location.reload(); };
    init();
  }

  /* ---------------- 초기화 · 이동 ---------------- */
  function init() {
    if (!CFG || !CFG.creators || !CFG.creators.length) {
      $('#view').innerHTML = alertBox('설정 파일 오류', '<p>config.js 에 크리에이터가 없습니다.</p>');
      return;
    }
    $('#siteTitle').textContent = CFG.siteTitle || '크리에이터 대시보드';
    const params = new URLSearchParams(location.search);
    state.creator = CFG.creators.find((c) => c.id === params.get('c')) || CFG.creators[0];
    document.title = `${state.creator.name} · ${CFG.siteTitle || '대시보드'}`;
    $('#creatorName').textContent = state.creator.name;

    const sel = $('#creatorSelect');
    if (CFG.creators.length > 1) {
      sel.hidden = false;
      sel.innerHTML = CFG.creators.map((c) => `<option value="${esc(c.id)}"${c === state.creator ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
      sel.onchange = () => { location.href = `?c=${encodeURIComponent(sel.value)}`; };
    }
    $('#refreshBtn').onclick = () => { delete state.cache[state.cat.id]; show(); };
    window.addEventListener('hashchange', route);
    route();
    const mins = Math.max(1, CFG.refreshMinutes || 5);
    state.timer = setInterval(() => { const c = state.cache[state.cat?.id]; if (c && c.source !== 'upload') { delete state.cache[state.cat.id]; show(true); } }, mins * 60000);
  }

  function route() {
    const cats = state.creator.categories;
    const id = decodeURIComponent(location.hash.slice(1));
    state.cat = cats.find((c) => c.id === id) || cats[0];
    $('#tabs').innerHTML = cats.map((c, i) =>
      `<a class="tab${c === state.cat ? ' active' : ''}" href="#${encodeURIComponent(c.id)}">${esc(c.icon || '')} ${esc(c.title)}${i === 0 ? '<span class="main-badge">메인</span>' : ''}</a>`).join('');
    const act = $('#tabs .tab.active'); if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    state.tableLimit = 50;
    show();
  }

  /* ---------------- 데이터 불러오기 ---------------- */
  async function fetchCSV(url) {
    const bust = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now(); // 브라우저 캐시 방지
    let res;
    try {
      res = await fetch(bust, { cache: 'no-store' });
      if (!res.ok) res = await fetch(url, { cache: 'no-store' });
    } catch (e) {
      const err = new Error('network'); err.kind = 'cors'; throw err;
    }
    if (!res.ok) { const err = new Error('HTTP ' + res.status); err.kind = 'http'; err.status = res.status; throw err; }
    const text = P.decodeBuffer(await res.arrayBuffer());
    if (/^\s*<(!doctype|html)/i.test(text)) { const err = new Error('html'); err.kind = 'html'; throw err; }
    return text;
  }

  async function show(silent) {
    const cat = state.cat;
    destroyCharts();
    if (!silent) $('#view').innerHTML = '<div class="loading">시트를 불러오는 중…</div>';
    let entry = state.cache[cat.id];
    if (!entry) {
      // 1순위: 구글 시트 링크(url) → 2순위: 페이지 안에 암호화해 둔 예비 데이터(fallback)
      if (!cat.url && !cat.fallback) return renderError(cat, { kind: 'nourl' });
      let firstErr = null;
      if (cat.url) {
        try { entry = { rows: P.parseCSV(await fetchCSV(cat.url)), source: 'url', at: new Date() }; }
        catch (e) { firstErr = e; }
      }
      if (!entry && cat.fallback) {
        entry = { rows: P.parseCSV(cat.fallback.text), source: 'file', name: cat.fallback.asOf, at: new Date(), sheetErr: firstErr };
      }
      if (!entry) return renderError(cat, firstErr);
      state.cache[cat.id] = entry;
    }
    if (state.cat !== cat) return; // 그 사이 탭이 바뀐 경우
    const label = { url: '시트 연동', file: '예비 데이터', upload: '업로드 파일' }[entry.source];
    $('#updatedAt').textContent = `${label} · ${entry.at.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`;
    try {
      const head = entry.source === 'upload' ? `<div class="banner">📎 직접 업로드한 <b>${esc(entry.name)}</b> 파일로 보고 있어요. 페이지를 새로 열면 다시 원래 데이터를 불러옵니다.</div>`
        : entry.source === 'file' && entry.sheetErr ? `<div class="banner">⚠️ 구글 시트를 불러오지 못해 <b>${esc(entry.name)}</b> 기준 예비 데이터로 표시하고 있어요. 시트의 최신 내용이 아닐 수 있어요. 잠시 뒤 ⟳ 를 눌러 주세요.</div>` : '';
      if (cat.type === 'schedule') renderSchedule(entry.rows, head);
      else if (cat.type === 'inquiries') renderInquiries(entry.rows, head);
      else if (cat.type === 'performance') renderPerformance(entry.rows, head);
      else renderTable(entry.rows, head);
    } catch (e) {
      console.error(e);
      renderError(cat, { kind: 'parse', message: e.message });
    }
  }

  /* ---------------- 오류 · 업로드 화면 ---------------- */
  function alertBox(title, body) { return `<div class="alert"><h2>${title}</h2>${body}</div>`; }
  function renderError(cat, e) {
    const msgs = {
      nofile: ['데이터 파일을 찾지 못했어요', `<p>저장소에 <code>${esc(e.file)}</code> 파일이 없어요. <b>index.html과 같은 위치</b>에 이 이름 그대로 올렸는지 확인해 주세요. (대소문자·확장자 포함)</p>`],
      nourl: ['CSV 링크가 아직 설정되지 않았어요', `<p><code>config.js</code> 파일에서 <b>${esc(cat.title)}</b>의 <code>url</code> 칸에 구글 시트 ‘웹에 게시’ CSV 링크를 넣어 주세요.</p>`],
      cors: ['브라우저가 CSV를 불러오지 못했어요', '<p>CORS 차단이거나 인터넷 연결 문제일 수 있어요. 구글 시트에서 <b>파일 → 공유 → 웹에 게시</b>가 켜져 있는지, 링크가 <code>…/pub?gid=…&amp;output=csv</code> 형태인지 확인해 주세요.</p>'],
      http: ['시트 링크에 접근할 수 없어요', `<p>서버가 오류(${esc(e.status)})를 돌려줬어요. 게시가 중지되었거나 링크가 바뀌었을 수 있어요.</p>`],
      html: ['링크가 CSV 형식이 아니에요', '<p>웹페이지(HTML) 링크로 보여요. ‘웹에 게시’ 창에서 형식을 <b>쉼표로 구분된 값(.csv)</b>으로 선택한 링크를 사용해 주세요.</p>'],
      parse: ['CSV 내용을 해석하지 못했어요', `<p>${esc(e.message)}</p><p>시트의 제목 줄이나 칸 구성이 바뀌었는지 확인해 주세요.</p>`]
    };
    const [t, b] = msgs[e.kind] || ['불러오기 실패', `<p>${esc(e.message || e)}</p>`];
    $('#updatedAt').textContent = '불러오기 실패';
    $('#view').innerHTML = alertBox('⚠️ ' + t, b + `
      <p>임시 데이터로 대신 보여주지 않아요. 대신 CSV 파일을 직접 올려서 볼 수 있어요.</p>
      <div class="drop" id="drop">
        <p>CSV 파일을 여기로 끌어 놓거나 <label for="file">파일 선택</label></p>
        <input type="file" id="file" accept=".csv,text/csv" hidden>
      </div>
      <p style="margin-top:14px"><button class="btn" id="retry">다시 시도</button></p>`);
    const drop = $('#drop'); const file = $('#file');
    const take = async (f) => {
      if (!f) return;
      const text = P.decodeBuffer(await f.arrayBuffer());
      state.cache[cat.id] = { rows: P.parseCSV(text), source: 'upload', name: f.name, at: new Date() };
      show();
    };
    file.onchange = () => take(file.files[0]);
    drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (ev) => { ev.preventDefault(); drop.classList.remove('over'); take(ev.dataTransfer.files[0]); };
    $('#retry').onclick = () => show();
  }

  /* ---------------- 공통: 차트 ---------------- */
  function destroyCharts() { state.charts.forEach((c) => c.destroy()); state.charts = []; }
  function chart(el, cfg) {
    if (!window.Chart) { el.parentElement.innerHTML = '<div class="empty">차트 라이브러리를 불러오지 못했어요.</div>'; return; }
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.color = cssVar('--muted');
    Chart.defaults.borderColor = cssVar('--line');
    state.charts.push(new Chart(el, cfg));
  }
  const kpi = (label, value, sub, hero) => `<div class="kpi${hero ? ' hero' : ''}"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub || '&nbsp;'}</div></div>`;

  /* ================= 광고 스케줄 ================= */
  function renderSchedule(rows, head) {
    const S = P.parseSchedule(rows, state.creator.scheduleStartYear);
    const ev = S.events; const t0 = today();
    if (!S.blocks.length) throw new Error('"10월 스케줄" 같은 달력 제목을 찾지 못했습니다.');

    // 표시할 달: 오늘이 범위 안이면 이번 달, 아니면 첫 달
    const months = S.blocks.map((b) => ({ y: b.year, m: b.month - 1 }));
    if (!state.calMonth || !months.some((x) => x.y === state.calMonth.y && x.m === state.calMonth.m)) {
      state.calMonth = months.find((x) => x.y === t0.getFullYear() && x.m === t0.getMonth()) || months[0];
    }
    const thisMonth = ev.filter((e) => e.date.getFullYear() === t0.getFullYear() && e.date.getMonth() === t0.getMonth());
    const nextUpload = ev.find((e) => e.type === 'upload' && e.date >= t0);
    const brands = groupBrands(ev);
    const activeBrands = brands.filter((b) => b.last >= t0);
    const range = `${months[0].m + 1}월 – ${months[months.length - 1].m + 1}월`;

    const notice = S.notices.length
      ? `<div class="notice"><details><summary>📌 스케줄 안내</summary><div style="margin-top:8px">${esc(S.notices.join('\n'))}</div></details></div>` : '';

    $('#view').innerHTML = head + notice + `
      <div class="kpis">
        ${nextUpload ? kpi('🚀 다음 업로드', `${dday(nextUpload.date)}`, `${mdw(nextUpload.date)} · ${esc(nextUpload.text)}`, true)
                     : kpi('🚀 다음 업로드', '없음', '예정된 업로드 일정이 없어요', true)}
        ${kpi(`🗓️ ${t0.getMonth() + 1}월 일정`, `${thisMonth.length}<small>건</small>`, `업로드 ${thisMonth.filter((e) => e.type === 'upload').length} · 제작 ${thisMonth.filter((e) => e.type !== 'upload').length}`)}
        ${kpi('🏷️ 진행 중 브랜드', `${activeBrands.length}<small>곳</small>`, activeBrands.map((b) => esc(b.name)).join(', ') || '현재 진행 중인 브랜드 없음')}
        ${kpi('📆 등록된 기간', range, `전체 일정 ${ev.length}건 · 브랜드 ${brands.length}곳`)}
      </div>

      <div class="grid-2" style="margin-top:12px">
        <div class="panel">
          <div class="cal-head">
            <h3 id="calTitle"></h3>
            <div class="cal-nav"><button class="icon-btn" id="prevM" aria-label="이전 달">‹</button><button class="btn" id="todayM">오늘</button><button class="icon-btn" id="nextM" aria-label="다음 달">›</button></div>
          </div>
          <div class="legend">${['draft', 'final', 'upload', 'shoot', 'other'].filter((k) => ev.some((e) => e.type === k)).map((k) => `<span><i class="bg-${k}"></i>${TYPE_LABEL[k]}</span>`).join('')}</div>
          <div class="cal" id="cal"></div>
        </div>
        <div class="panel">
          <h3>⏭️ 다가오는 일정</h3>
          ${listHTML(ev.filter((e) => e.date >= t0).slice(0, 8), '앞으로 예정된 일정이 없어요')}
        </div>
      </div>

      <div class="section-title"><h2>브랜드별 진행 현황</h2><span class="hint">가편 → 최종 → 업로드</span></div>
      <div class="brands">${brands.map(brandCard).join('') || '<div class="empty">등록된 광고 일정이 없어요</div>'}</div>

      <div class="section-title"><h2>전체 일정</h2><span class="hint">지난 일정은 흐리게 표시돼요</span></div>
      <div class="panel">${listHTML(ev, '등록된 일정이 없어요', true)}</div>`;

    const draw = () => drawCalendar(ev, state.calMonth);
    const idx = () => months.findIndex((x) => x.y === state.calMonth.y && x.m === state.calMonth.m);
    $('#prevM').onclick = () => { const i = idx(); if (i > 0) { state.calMonth = months[i - 1]; draw(); } };
    $('#nextM').onclick = () => { const i = idx(); if (i < months.length - 1) { state.calMonth = months[i + 1]; draw(); } };
    $('#todayM').onclick = () => { state.calMonth = months.find((x) => x.y === t0.getFullYear() && x.m === t0.getMonth()) || months[0]; draw(); };
    draw();

    function drawCalendar(events, cm) {
      const i = idx();
      $('#calTitle').textContent = `${cm.y}년 ${cm.m + 1}월`;
      $('#prevM').disabled = i <= 0; $('#nextM').disabled = i >= months.length - 1;
      const first = new Date(cm.y, cm.m, 1);
      const start = new Date(cm.y, cm.m, 1 - first.getDay());
      const last = new Date(cm.y, cm.m + 1, 0);
      const cells = Math.ceil((first.getDay() + last.getDate()) / 7) * 7;
      const byDay = {};
      events.forEach((e) => { (byDay[e.dateKey] = byDay[e.dateKey] || []).push(e); });
      let html = WEEK.map((w, k) => `<div class="dow${k === 0 ? ' sun' : ''}">${w}</div>`).join('');
      for (let k = 0; k < cells; k++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + k);
        const list = byDay[P.iso(d)] || [];
        const cls = ['day', d.getMonth() !== cm.m ? 'out' : '', d.getDay() === 0 ? 'sun' : '', +d === +t0 ? 'today' : ''].join(' ');
        html += `<div class="${cls}" title="${esc(list.map((e) => e.text).join('\n'))}"><span class="num">${d.getDate()}</span>
          ${list.map((e) => `<span class="chip t-${e.type}">${esc(e.text)}</span>`).join('')}
          <div class="dots">${list.map((e) => `<i class="bg-${e.type}"></i>`).join('')}</div></div>`;
      }
      $('#cal').innerHTML = html;
    }
  }

  function listHTML(list, emptyMsg, dimPast) {
    if (!list.length) return `<div class="empty">${emptyMsg}</div>`;
    const t0 = today();
    return `<ul class="timeline">${list.map((e) => `
      <li class="${dimPast && e.date < t0 ? 'past' : ''}">
        <div class="d"><b>${e.date.getMonth() + 1}/${e.date.getDate()}</b><span>${WEEK[e.date.getDay()]}요일</span></div>
        <div class="t">${esc(e.text)}</div>
        <span class="pill t-${e.type}">${TYPE_LABEL[e.type]}</span>
        <span class="dday">${dday(e.date)}</span>
      </li>`).join('')}</ul>`;
  }

  function groupBrands(ev) {
    const map = new Map();
    ev.forEach((e) => {
      if (!map.has(e.brand)) map.set(e.brand, { name: e.brand, items: [], last: e.date });
      const b = map.get(e.brand); b.items.push(e); if (e.date > b.last) b.last = e.date;
    });
    return [...map.values()];
  }
  function brandCard(b) {
    const t0 = today();
    const step = (type, label) => {
      const it = b.items.filter((e) => e.type === type);
      const on = it.length > 0;
      return `<div class="step ${on ? 'on t-' + type : ''}">${label}<b>${on ? it.map((e) => md(e.date)).join(', ') : '–'}</b></div>`;
    };
    const up = b.items.filter((e) => e.type === 'upload');
    const status = up.length && up.every((e) => e.date < t0) ? ['완료', 't-upload'] : b.last < t0 ? ['지난 일정', 't-other'] : ['진행 중', 't-final'];
    const extra = b.items.filter((e) => !['draft', 'final', 'upload'].includes(e.type));
    return `<div class="brand-card"><h4>${esc(b.name)}<span class="pill ${status[1]}">${status[0]}</span></h4>
      <div class="steps">${step('draft', '가편·1차')}${step('final', '최종본')}${step('upload', '업로드')}</div>
      ${extra.length ? `<div class="sub" style="margin-top:8px;font-size:12px;color:var(--muted)">${extra.map((e) => `${md(e.date)} ${esc(e.text)}`).join(' · ')}</div>` : ''}</div>`;
  }

  /* ================= 광고·공구 문의 ================= */
  function renderInquiries(rows, head) {
    const { items } = P.parseInquiries(rows);
    if (!items.length) throw new Error('문의 데이터가 한 건도 없습니다.');
    const t0 = today();
    const count = (arr, f) => arr.reduce((m, x) => { const k = f(x); if (k != null && k !== '') m[k] = (m[k] || 0) + 1; return m; }, {});
    const typeOrder = ['광고(PPL)', '선제안', '공구마켓', '공동구매', '단순선물'];
    const byType = count(items, (x) => x.type);
    const types = [...typeOrder.filter((k) => byType[k]), ...Object.keys(byType).filter((k) => !typeOrder.includes(k))];
    const monthKeys = [...new Set(items.map((x) => x.month).filter(Boolean))].sort();
    const ym = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const curKey = monthKeys.includes(ym(t0)) ? ym(t0) : monthKeys[monthKeys.length - 1];
    const prevKey = monthKeys[monthKeys.indexOf(curKey) - 1];
    const byMonth = count(items, (x) => x.month);
    const cur = byMonth[curKey] || 0, prev = byMonth[prevKey] || 0;
    const diff = prev ? Math.round(((cur - prev) / prev) * 100) : null;
    // 확정: "확정", "확정(3/2)", "O", "○", "✅", 체크박스(TRUE), "진행" / 드랍: "X", "드랍", "드롭", "취소"
    const v = (x) => x.confirm.replace(/\s/g, '');
    const isDrop = (x) => /^(x|×|✕|❌|false)$/i.test(v(x)) || /드랍|드롭|취소|불가/.test(v(x));
    const isConfirm = (x) => !isDrop(x) && (/^(확정|진행확정|진행|o|○|◯|✅|✔|☑|true|y|yes)/i.test(v(x)));
    const confirmed = items.filter((x) => x.done || isConfirm(x));
    const pending = items.filter((x) => !x.done && !isConfirm(x) && !isDrop(x) && /미정|대기|보류|검토|협의/.test(v(x))).length;
    const dropped = items.filter((x) => !x.done && isDrop(x)).length;
    const ppl = byType['광고(PPL)'] || 0;
    const noDate = items.filter((x) => !x.date);
    const mLabel = (k) => `${+k.slice(5)}월`;

    $('#view').innerHTML = head + `
      ${noDate.length ? `<div class="banner">ℹ️ 날짜를 인식하지 못한 문의 ${noDate.length}건은 월별 집계에서 빠지고 목록에는 표시돼요: ${noDate.map((x) => `${x.row}행 ${esc(x.brand || '(브랜드 없음)')}${x.rawDate ? ` “${esc(x.rawDate)}”` : ' (문의일 빈칸)'}`).join(', ')}</div>` : ''}
      <div class="kpis">
        ${kpi('📨 총 문의', `${items.length.toLocaleString()}<small>건</small>`, `${monthKeys.length ? mLabel(monthKeys[0]) + ' ~ ' + mLabel(monthKeys[monthKeys.length - 1]) : ''} 누적`, true)}
        ${kpi(`📈 ${mLabel(curKey)} 문의`, `${cur}<small>건</small>`, prevKey ? `전월(${mLabel(prevKey)}) ${prev}건 대비 ${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff)}%` : '')}
        ${kpi('📣 광고(PPL)', `${ppl}<small>건</small>`, `전체의 ${Math.round((ppl / items.length) * 100)}% · 공구 ${(byType['공구마켓'] || 0) + (byType['공동구매'] || 0)}건`)}
        ${kpi('✅ 진행 확정', `${confirmed.length}<small>건</small>`, `${confirmed.map((x) => esc(x.brand)).join(', ') || '없음'} · 미정 ${pending} · 드랍 ${dropped}`)}
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="panel"><h3>월별 문의 추이</h3><div class="chart-box"><canvas id="cMonth"></canvas></div></div>
        <div class="panel"><h3>유형별 비중</h3><div class="chart-box"><canvas id="cType"></canvas></div></div>
      </div>
      <div class="grid-2 even" style="margin-top:12px">
        <div class="panel"><h3>카테고리 TOP 10 <span class="hint" id="catHint" style="font-weight:400;color:var(--muted);font-size:12px"></span></h3><div class="chart-box"><canvas id="cCat"></canvas></div></div>
        <div class="panel"><h3>요청 플랫폼 <span class="hint" id="platHint" style="font-weight:400;color:var(--muted);font-size:12px"></span></h3><div class="chart-box"><canvas id="cPlat"></canvas></div></div>
      </div>
      <div class="section-title"><h2>문의 목록</h2><span class="hint" id="listCount"></span></div>
      <div class="toolbar">
        <input id="q" type="search" placeholder="브랜드 · 제품 · 대행사 · 비고 검색">
        <select id="fType"><option value="">전체 유형</option>${types.map((k) => `<option>${esc(k)}</option>`).join('')}</select>
        <select id="fMonth"><option value="">전체 월</option>${[...monthKeys].reverse().map((k) => `<option value="${k}">${k.slice(0, 4)}년 ${mLabel(k)}</option>`).join('')}</select>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>문의일</th><th>유형</th><th>브랜드</th><th>대행사</th><th>카테고리</th><th>제품명</th><th>요청 플랫폼</th><th>소통 현황</th><th>확정</th></tr></thead>
        <tbody id="tbody"></tbody></table></div>
      <div class="more" id="more"></div>`;

    // 차트 색
    const palette = [cssVar('--accent'), cssVar('--final'), cssVar('--upload'), '#14b8a6', cssVar('--shoot'), cssVar('--draft'), cssVar('--other')];
    const colorOf = (k) => palette[types.indexOf(k) % palette.length];

    chart($('#cMonth'), {
      type: 'bar',
      data: { labels: monthKeys.map(mLabel), datasets: types.map((ty) => ({ label: ty, data: monthKeys.map((m) => items.filter((x) => x.month === m && x.type === ty).length), backgroundColor: colorOf(ty), borderRadius: 4, maxBarThickness: 38 })) },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { precision: 0 } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: { callbacks: { footer: (it) => '합계 ' + it.reduce((s, x) => s + x.parsed.y, 0) + '건' } } } }
    });
    chart($('#cType'), {
      type: 'doughnut',
      data: { labels: types, datasets: [{ data: types.map((k) => byType[k]), backgroundColor: types.map(colorOf), borderColor: cssVar('--surface'), borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: { callbacks: { label: (c) => ` ${c.label}: ${c.parsed}건 (${Math.round((c.parsed / items.length) * 100)}%)` } } } }
    });
    // 카테고리: 띄어쓰기 차이만 통일
    const catCount = {}; let uncategorized = 0;
    items.forEach((x) => { if (x.category === '미분류') { uncategorized++; return; } const k = x.category.replace(/\s+/g, ''); catCount[k] = (catCount[k] || 0) + 1; });
    const topCat = Object.entries(catCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
    $('#catHint').textContent = `· 미입력 ${uncategorized}건 제외`;
    hbar($('#cCat'), topCat, palette[0]);
    // 플랫폼: "IG 릴스, YT숏츠" 처럼 여러 개면 각각 집계
    const platCount = {}; let noPlat = 0;
    items.forEach((x) => { const ps = x.platform.split(/[,/]/).map((s) => s.trim()).filter(Boolean); if (!ps.length) noPlat++; ps.forEach((p) => { platCount[p] = (platCount[p] || 0) + 1; }); });
    $('#platHint').textContent = `· 미입력 ${noPlat}건 제외`;
    hbar($('#cPlat'), Object.entries(platCount).sort((a, b) => b[1] - a[1]), palette[2]);

    // 목록
    const sorted = [...items].sort((a, b) => (b.date || 0) - (a.date || 0) || b.row - a.row);
    const drawTable = () => {
      const q = $('#q').value.trim().toLowerCase(), ft = $('#fType').value, fm = $('#fMonth').value;
      const list = sorted.filter((x) => (!ft || x.type === ft) && (!fm || x.month === fm) &&
        (!q || [x.brand, x.agency, x.product, x.category, x.note, x.status, x.platform].join(' ').toLowerCase().includes(q)));
      $('#listCount').textContent = `${list.length}건`;
      $('#tbody').innerHTML = list.slice(0, state.tableLimit).map((x, i) => `
        <tr data-i="${i}">
          <td class="nowrap" data-label="문의일">${x.date ? `${x.date.getFullYear() % 100}.${x.date.getMonth() + 1}.${x.date.getDate()}` : esc(x.rawDate || '—')}</td>
          <td data-label="유형"><span class="pill ty-${esc(x.type.replace(/[()\s]/g, ''))}">${esc(x.type)}</span></td>
          <td class="brand" data-label="브랜드"><b>${esc(x.brand || '—')}</b></td>
          <td data-label="대행사">${esc(x.agency)}</td>
          <td data-label="카테고리">${x.category === '미분류' ? '' : esc(x.category)}</td>
          <td class="wrap" data-label="제품명">${esc(x.product)}</td>
          <td data-label="플랫폼">${esc(x.platform)}</td>
          <td class="wrap" data-label="소통">${esc(x.status)}</td>
          <td data-label="확정">${x.done ? '✅ 완료' : esc(x.confirm)}</td>
        </tr>`).join('') || '<tr><td colspan="9" class="empty">조건에 맞는 문의가 없어요</td></tr>';
      $('#more').innerHTML = list.length > state.tableLimit ? `<button class="btn" id="moreBtn">더 보기 (${list.length - state.tableLimit}건 남음)</button>` : '';
      if ($('#moreBtn')) $('#moreBtn').onclick = () => { state.tableLimit += 50; drawTable(); };
      $('#tbody').querySelectorAll('tr[data-i]').forEach((tr) => {
        tr.onclick = () => {
          const nx = tr.nextElementSibling;
          if (nx && nx.classList.contains('detail')) { nx.remove(); return; }
          const x = list[+tr.dataset.i];
          const f = [['문의 경로', x.route], ['업로드 채널', x.channel], ['희망 일정', x.wish], ['정산 일정', x.settle], ['진행 단가(VAT 제외)', x.price], ['담당자', x.contact], ['비고', x.note], ['시트 위치', x.row + '행']].filter((v) => v[1]);
          tr.insertAdjacentHTML('afterend', `<tr class="detail"><td colspan="9"><div class="detail-grid">${f.map(([k, v]) => `<div><span>${k}</span>${esc(v)}</div>`).join('')}</div></td></tr>`);
        };
      });
    };
    ['q', 'fType', 'fMonth'].forEach((id) => { $('#' + id).oninput = () => { state.tableLimit = 50; drawTable(); }; });
    drawTable();
  }

  function hbar(el, entries, color) {
    if (!entries.length) { el.parentElement.innerHTML = '<div class="empty">입력된 값이 없어요</div>'; return; }
    chart(el, {
      type: 'bar',
      data: { labels: entries.map((e) => e[0]), datasets: [{ data: entries.map((e) => e[1]), backgroundColor: color, borderRadius: 4, maxBarThickness: 18 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { precision: 0 } }, y: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.parsed.x}건` } } } }
    });
  }

  /* ================= 채널 성과 ================= */
  const fmt = (n) => (n == null ? '–' : Math.round(n).toLocaleString('ko-KR'));
  function kfmt(n) { // 123,456,789 → 1.2억 / 1,234,567 → 123만
    if (n == null) return '–';
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '<small>억</small>';
    if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, '') + '<small>만</small>';
    return n.toLocaleString('ko-KR');
  }
  function renderPerformance(rows, head) {
    const R = P.parsePerformance(rows, state.creator.name);
    if (!R.metrics.length) throw new Error('지표 데이터(구분 열)가 없습니다.');
    const find = (re) => R.metrics.find((m) => re.test(m.name));
    const fol = find(/팔로워/), views = find(/조회/), react = find(/반응/), target = find(/타깃|타겟/);
    const numeric = R.metrics.filter((m) => m.months.some((x) => x.num != null));
    // 데이터가 있는 마지막 달
    let last = -1;
    R.metrics.forEach((m) => m.months.forEach((x, k) => { if (x.num != null || x.pct != null) last = Math.max(last, k); }));
    const M = Array.from({ length: last + 1 }, (_, k) => `${k + 1}월`);
    const series = (m) => (m ? m.months.slice(0, last + 1).map((x) => x.num) : []);
    const sum = (m) => m.months.reduce((s, x) => s + (x.num || 0), 0);
    const lastVal = (m) => { for (let k = last; k >= 0; k--) if (m.months[k].num != null) return { k, v: m.months[k].num }; return null; };
    const change = (m) => {
      const lv = lastVal(m); if (!lv) return '';
      const pv = lv.k > 0 ? m.months[lv.k - 1].num : null;
      return `${lv.k + 1}월 ${fmt(lv.v)}` + (pv ? ` · 전월 대비 ${lv.v >= pv ? '▲' : '▼'} ${Math.abs(Math.round(((lv.v - pv) / pv) * 100))}%` : '');
    };
    // 반응률 = 반응수 ÷ 조회수 (두 값이 모두 있는 달만)
    const rate = views && react ? views.months.slice(0, last + 1).map((x, k) => (x.num && react.months[k].num != null ? (react.months[k].num / x.num) * 100 : null)) : [];
    const both = rate.map((r, k) => (r == null ? null : k)).filter((k) => k != null);
    const avgRate = both.length ? (both.reduce((s, k) => s + react.months[k].num, 0) / both.reduce((s, k) => s + views.months[k].num, 0)) * 100 : null;
    const tgtPct = target ? target.months.slice(0, last + 1).map((x) => x.pct) : [];
    const tgtLast = target ? (() => { for (let k = last; k >= 0; k--) if (target.months[k].raw && target.months[k].raw !== '-') return { k, raw: target.months[k].raw }; return null; })() : null;
    const tgtVals = tgtPct.filter((v) => v != null);

    // 빈칸·'-' 안내
    const gaps = numeric.map((m) => {
      const g = m.months.slice(0, last + 1).map((x, k) => (x.num == null ? `${k + 1}월${x.raw ? `(${x.raw})` : '(빈칸)'}` : null)).filter(Boolean);
      return g.length ? `${esc(m.name)}: ${g.join(', ')}` : null;
    }).filter(Boolean);

    $('#view').innerHTML = head +
      (!R.matched && R.creators.length ? `<div class="banner">ℹ️ 시트에서 “${esc(state.creator.name)}” 이름을 찾지 못해 “${esc(R.creator)}” 데이터를 표시합니다.</div>` : '') +
      (gaps.length ? `<div class="banner">ℹ️ 값이 없는 달은 차트에서 비워 두고 계산에서 제외했어요 — ${gaps.join(' / ')}</div>` : '') + `
      <div class="kpis">
        ${fol ? kpi('👥 ' + esc(fol.name) + ' 누적', fmt(fol.acc ?? sum(fol)), change(fol), true) : ''}
        ${views ? kpi('▶️ ' + esc(views.name) + ' 누적', kfmt(views.acc ?? sum(views)), `${fmt(views.acc ?? sum(views))}회 · ${change(views)}`) : ''}
        ${react ? kpi('💬 ' + esc(react.name) + ' 누적', kfmt(react.acc ?? sum(react)), avgRate != null ? `평균 반응률 ${avgRate.toFixed(1)}% (반응수÷조회수)` : change(react)) : ''}
        ${target ? kpi('🎯 ' + esc(target.name), tgtLast ? esc(tgtLast.raw) : '–', tgtLast ? `${tgtLast.k + 1}월 기준${tgtVals.length ? ` · 평균 ${(tgtVals.reduce((a, b) => a + b, 0) / tgtVals.length).toFixed(1)}%` : ''}` : '') : ''}
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="panel"><h3>월별 조회수 · 반응수</h3><div class="chart-box"><canvas id="pViews"></canvas></div></div>
        <div class="panel"><h3>월별 ${esc(fol ? fol.name : '팔로워')}</h3><div class="chart-box"><canvas id="pFol"></canvas></div></div>
      </div>
      <div class="grid-2 even" style="margin-top:12px">
        <div class="panel"><h3>월별 반응률 <span style="font-weight:400;color:var(--muted);font-size:12px">· 반응수 ÷ 조회수</span></h3><div class="chart-box"><canvas id="pRate"></canvas></div></div>
        <div class="panel"><h3>${esc(target ? target.name : '주요 타깃')} 추이</h3><div class="chart-box"><canvas id="pTgt"></canvas></div></div>
      </div>
      <div class="section-title"><h2>월별 데이터</h2><span class="hint">검증: 1~12월 합계 = 시트 ‘누적’ 값</span></div>
      <div class="table-wrap scroll"><table>
        <thead><tr><th class="stick">구분</th><th>누적</th>${Array.from({ length: 12 }, (_, k) => `<th>${k + 1}월</th>`).join('')}<th>검증</th></tr></thead>
        <tbody>${R.metrics.map((m) => {
          const isNum = m.months.some((x) => x.num != null);
          const s = sum(m);
          const ok = !isNum ? '—' : m.acc == null ? '누적 없음' : s === m.acc ? '✅ 일치' : `⚠️ 차이 ${fmt(m.acc - s)}`;
          return `<tr><td class="stick nowrap"><b>${esc(m.name)}</b></td><td class="nowrap">${esc(m.accRaw || '')}</td>${m.months.map((x) => `<td class="nowrap">${esc(x.raw)}</td>`).join('')}<td class="nowrap">${ok}</td></tr>`;
        }).join('')}</tbody></table></div>`;

    const c1 = cssVar('--accent'), c2 = cssVar('--upload'), c3 = cssVar('--shoot'), c4 = cssVar('--final');
    const base = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } } } };
    const noData = (id) => { $(id).parentElement.innerHTML = '<div class="empty">데이터가 없어요</div>'; };
    if (views || react) chart($('#pViews'), {
      data: { labels: M, datasets: [
        views && { type: 'bar', label: views.name, data: series(views), backgroundColor: c1, borderRadius: 4, maxBarThickness: 34, yAxisID: 'y', order: 2 },
        react && { type: 'line', label: react.name, data: series(react), borderColor: c3, backgroundColor: c3, tension: .3, pointRadius: 3, spanGaps: false, yAxisID: 'y1', order: 1 }
      ].filter(Boolean) },
      options: { ...base, scales: { x: { grid: { display: false } }, y: { position: 'left', ticks: { callback: (v) => (v >= 1e4 ? v / 1e4 + '만' : v) } }, y1: { position: 'right', grid: { display: false }, ticks: { callback: (v) => (v >= 1e4 ? v / 1e4 + '만' : v) } } },
        plugins: { ...base.plugins, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${c.parsed.y == null ? '데이터 없음' : fmt(c.parsed.y)}` } } } }
    }); else noData('#pViews');
    if (fol) chart($('#pFol'), {
      type: 'bar',
      data: { labels: M, datasets: [{ label: fol.name, data: series(fol), backgroundColor: c2, borderRadius: 4, maxBarThickness: 34 }] },
      options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${fmt(c.parsed.y)}명` } } }, scales: { x: { grid: { display: false } } } }
    }); else noData('#pFol');
    if (rate.some((v) => v != null)) chart($('#pRate'), {
      type: 'line',
      data: { labels: M, datasets: [{ label: '반응률', data: rate, borderColor: c3, backgroundColor: c3, tension: .3, pointRadius: 3 }] },
      options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.parsed.y == null ? '데이터 없음' : c.parsed.y.toFixed(1) + '%'}` } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: (v) => v + '%' } } } }
    }); else noData('#pRate');
    if (tgtVals.length) chart($('#pTgt'), {
      type: 'line',
      data: { labels: M, datasets: [{ label: target.name, data: tgtPct, borderColor: c4, backgroundColor: c4, tension: .3, pointRadius: 3 }] },
      options: { ...base, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${target.months[c.dataIndex].raw || '데이터 없음'}` } } }, scales: { x: { grid: { display: false } }, y: { suggestedMin: Math.floor(Math.min(...tgtVals) - 2), suggestedMax: Math.ceil(Math.max(...tgtVals) + 2), ticks: { callback: (v) => v + '%' } } } }
    }); else noData('#pTgt');
  }

  /* ================= 기타 CSV: 자동 표 ================= */
  function renderTable(rows, head) {
    const T = P.parseGenericTable(rows);
    if (!T.header.length) throw new Error('표 형태의 데이터를 찾지 못했습니다.');
    $('#view').innerHTML = head + `
      <div class="kpis">${kpi('📄 데이터 행', `${T.rows.length}<small>행</small>`, `${T.header.length}개 열`, true)}</div>
      <div class="section-title"><h2>${esc(state.cat.title)}</h2><span class="hint" id="cnt"></span></div>
      <div class="toolbar"><input id="q" type="search" placeholder="검색"></div>
      <div class="table-wrap"><table><thead><tr>${T.header.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div>`;
    const draw = () => {
      const q = $('#q').value.trim().toLowerCase();
      const list = T.rows.filter((r) => !q || r.join(' ').toLowerCase().includes(q));
      $('#cnt').textContent = `${list.length}행`;
      $('#tb').innerHTML = list.slice(0, 300).map((r) => `<tr>${r.map((c, i) => `<td class="wrap" data-label="${esc(T.header[i])}">${esc(c)}</td>`).join('')}</tr>`).join('');
    };
    $('#q').oninput = draw; draw();
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
